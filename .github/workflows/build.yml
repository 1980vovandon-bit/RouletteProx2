name: Build RoulettePro

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

            - name: Extract source
        run: |
          mkdir -p source
          unzip '*.jar' -d source

      - name: Build mod
        run: |
          cd source/RoulettePro-1.21.1
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: RoulettePro-JAR
          path: source/RoulettePro-1.21.1/build/libs/*.jar
